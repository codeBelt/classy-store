name: React Next.js integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: ['off', 'on']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Use Ubuntu archive mirror for browser dependencies
        run: |
          # Avoid slow Azure mirror downloads on hosted runners.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/classy-store
      - name: Packed production Next.js consumer (Compiler ${{ matrix.compiler }})
        run: bun run test:react:next
        env:
          NEXT_TEST_MODES: ${{ matrix.compiler }}
      - name: Save Next.js build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-next-compiler-${{ matrix.compiler }}
          path: test-results/next
          if-no-files-found: ignore
          retention-days: 7
