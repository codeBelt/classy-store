name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/classy-store
      - run: bun run test:browser
      - name: React scale commit budgets (production, Compiler off/on)
        run: bun packages/classy-store/tests/performance/runPerformance.ts
        env:
          BENCHMARK_SAMPLES: '1'
          BENCHMARK_ITERATIONS: '3'
          BENCHMARK_LABEL: ci-smoke
      - name: React memory retention (production, Compiler off/on)
        run: bun packages/classy-store/tests/memory/runMemory.ts
        env:
          MEMORY_CYCLES: '6'
          MEMORY_SIZE: '24'
          MEMORY_LABEL: ci-smoke
