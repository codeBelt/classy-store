name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      # Packed-consumer typechecks resolve the package's generated declarations.
      - run: bun run build
      - run: bun run typecheck
      - name: Solid 2 example production build
        run: bun run --filter classy-store-solid-example build
      - name: Angular 22 example production build
        run: bun run --filter classy-store-angular-example build
      - name: Use Ubuntu archive mirror for browser dependencies
        run: |
          # Avoid slow Azure mirror downloads on hosted runners.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/classy-store
      - run: bun run test:browser
      - name: Packed Vue and Svelte minimum versions
        run: node packages/classy-store/tests/frameworkCompatibility/runCompatibility.mjs
      - name: Packed Angular 22 compatibility (22.0.0 and 22.2.3)
        run: node packages/classy-store/tests/angularCompatibility/runCompatibility.mjs
      - name: React scale commit budgets (production, Compiler off/on)
        run: bun packages/classy-store/tests/performance/runPerformance.ts
        env:
          BENCHMARK_SAMPLES: '1'
          BENCHMARK_ITERATIONS: '3'
          BENCHMARK_LABEL: ci-smoke
      - name: React memory retention (production, Compiler off/on)
        run: bun packages/classy-store/tests/memory/runMemory.ts
        env:
          MEMORY_CYCLES: '6'
          MEMORY_SIZE: '24'
          MEMORY_LABEL: ci-smoke
